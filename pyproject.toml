[project]
name = "netwatch"
version = "0.1.0"
description = "Per-app network monitor for Windows — see what your processes connect to, and block them."
readme = "README.md"
authors = [
    { name = "Typixal", email = "ihsanbinsajid@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "psutil>=5.9.8",
]

[project.scripts]
netwatch = "netwatch.app:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.4.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Keep the package cache on this drive, inside the project, instead of
# %LOCALAPPDATA%\uv\cache on C:. Also lets uv hardlink instead of copy.
cache-dir = ".uv-cache"

[tool.uv.build-backend]
module-root = "src"
module-name = "netwatch"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
